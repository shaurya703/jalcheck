services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jalcheck
      POSTGRES_PASSWORD: jalcheck
      POSTGRES_DB: jalcheck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jalcheck"]
      interval: 3s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jalcheck:jalcheck@db:5432/jalcheck
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8200:8000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3200:80"]
volumes:
  pgdata:
